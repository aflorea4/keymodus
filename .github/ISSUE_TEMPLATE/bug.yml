name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please don't paste serial numbers, usernames or other personal details — they aren't needed.
  - type: input
    id: version
    attributes:
      label: Keymodus version
      placeholder: "0.2.0 (Settings shows it)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux (X11), Linux (Wayland)]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and connection
      placeholder: "e.g. MX Master 3S over Bolt receiver"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant log lines
      description: Settings → Activity → Show log file. Remove anything personal before pasting.
      render: text
